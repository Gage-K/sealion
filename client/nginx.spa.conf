# Internal nginx inside the client image. The front-door nginx (bibliotab's)
# proxies to this on port 80. SPA fallback so client-side routes resolve to index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
