name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Allow the deploy job's GITHUB_TOKEN to create GitHub Deployment objects
# (these are what populate the repo's "Deployments" panel).
permissions:
  contents: read
  deployments: write

jobs:
  # ---------------------------------------------------------------------------
  # CI gate: lint, build, and test on every push and PR. Deploy waits on this,
  # so broken code never reaches the VPS.
  # ---------------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Docker/prod runtime
          cache: pnpm

      # Builds better-sqlite3's native binary (pinned to v11 in
      # pnpm-workspace.yaml so it fetches a Node-22-compatible prebuild).
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --recursive test

  # ---------------------------------------------------------------------------
  # CD: SSH into Hetzner and roll the stack forward. Only on pushes to main,
  # and only once CI is green.
  # ---------------------------------------------------------------------------
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Start GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              production_environment: true,
              required_contexts: [],
              auto_merge: false,
              description: 'Deploy to Hetzner',
            });
            core.setOutput('id', deployment.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying to Hetzner…',
            });

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799  # v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # No DB migration step: sealion's SQLite schema is created on boot
          # (CREATE TABLE IF NOT EXISTS in server/src/db.js) and the rooms
          # volume is durable, so building and swapping the containers is the
          # whole deploy.
          script: |
            set -e
            cd ~/sealion
            git pull
            compose="docker compose -f docker-compose.prod.yml"
            echo "::group::Build images"
            $compose build
            echo "::endgroup::"
            $compose up -d
            # `up -d` returns as soon as containers are created, even if the sync
            # server then crash-loops. Wait for it to report that it is listening.
            for i in $(seq 1 30); do
              if $compose logs sealion-sync 2>&1 | grep -q "Listening on port"; then
                echo "Sync server is up."
                exit 0
              fi
              sleep 2
            done
            echo "Sync server did not start within 60s. Recent logs:"
            $compose logs --tail 100 sealion-sync
            exit 1

      - name: Finish GitHub deployment
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              environment_url: 'https://sealion.pinniped.app',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Deployed to Hetzner' : 'Deploy failed',
            });
